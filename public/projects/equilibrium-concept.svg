<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity=".07"/></pattern>
    <linearGradient id="line"><stop stop-color="#ff864d"/><stop offset="1" stop-color="#ffb78b"/></linearGradient>
  </defs>
  <rect width="1200" height="800" rx="24" fill="#101115"/>
  <rect width="1200" height="800" rx="24" fill="url(#grid)"/>
  <text x="72" y="85" fill="#ff986b" font-family="monospace" font-size="16" letter-spacing="3">EQUILIBRIUMX / CONCEPT</text>
  <text x="72" y="148" fill="#f3f2ee" font-family="Arial, sans-serif" font-size="36">Strategy finds its voice.</text>
  <text x="72" y="188" fill="#b9b9c2" font-family="Arial, sans-serif" font-size="19">A simplified view of multi-agent negotiation</text>
  <g fill="none" stroke="url(#line)" stroke-width="3"><path d="M350 390H425"/><path d="M775 390H850"/></g>
  <g fill="#ff986b"><circle cx="388" cy="390" r="6"/><circle cx="812" cy="390" r="6"/></g>
  <g fill="#17191f" stroke="#676973" stroke-width="2"><rect x="72" y="300" width="278" height="180" rx="12"/><rect x="425" y="300" width="350" height="180" rx="12"/><rect x="850" y="300" width="278" height="180" rx="12"/></g>
  <g font-family="monospace" font-size="15" fill="#ff986b" letter-spacing="2"><text x="100" y="345">01 / DECIDE</text><text x="453" y="345">02 / COMMUNICATE</text><text x="878" y="345">03 / INTERACT</text></g>
  <g font-family="Arial, sans-serif" font-size="27" fill="#f3f2ee"><text x="100" y="400">RL strategy</text><text x="453" y="400">LLM message</text><text x="878" y="400">Negotiation</text></g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#b9b9c2"><text x="100" y="440">Choose an action</text><text x="453" y="440">Express the strategy in words</text><text x="878" y="440">Exchange offers</text></g>
  <path d="M986 480V557H211V480" fill="none" stroke="#898992" stroke-opacity=".55" stroke-width="2" stroke-dasharray="7 10"/>
  <text x="600" y="598" text-anchor="middle" fill="#b9b9c2" font-family="monospace" font-size="15" letter-spacing="1">REPEATED ROUNDS / SIMPLIFIED</text>
  <text x="72" y="734" fill="#8d8e96" font-family="monospace" font-size="14">CONCEPTUAL ILLUSTRATION / NOT AN IMPLEMENTATION DIAGRAM</text>
</svg>
